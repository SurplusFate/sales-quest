<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sales Quest - gamified CRM">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sales_quest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sales_quest</title>
  <link rel="manifest" href="manifest.json">

  <!--
    核心修复: 防止 Flutter Web 在 WebView 中出现无限滚动
    原理: 1) 用 position:fixed 锁定 body 到视口大小
          2) 用 JS 覆盖 window.innerHeight 让 Flutter 获取正确高度
          3) 用 MutationObserver 持续修正 Flutter 元素尺寸
  -->
  <style>
    * { box-sizing: border-box; }
    html {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
    }
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
    }
    flt-glass-pane,
    flutter-view,
    flt-scene-host,
    flt-glass-pane > * {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
    }
    canvas {
      max-width: 100% !important;
      max-height: 100% !important;
    }
  </style>

  <!-- sql.js: SQLite WebAssembly for drift web database -->
  <script src="sql-wasm.js"></script>

  <!-- 视口修复脚本: 必须在 flutter_bootstrap.js 之前执行 -->
  <script>
    (function() {
      'use strict';

      function getRealHeight() {
        if (window.visualViewport && window.visualViewport.height > 0) {
          return window.visualViewport.height;
        }
        var ch = document.documentElement.clientHeight;
        if (ch > 0) return ch;
        return window.screen.height || 800;
      }

      function getRealWidth() {
        if (window.visualViewport && window.visualViewport.width > 0) {
          return window.visualViewport.width;
        }
        var cw = document.documentElement.clientWidth;
        if (cw > 0) return cw;
        return window.screen.width || 360;
      }

      try {
        Object.defineProperty(window, 'innerHeight', {
          get: function() { return getRealHeight(); },
          configurable: true
        });
        Object.defineProperty(window, 'innerWidth', {
          get: function() { return getRealWidth(); },
          configurable: true
        });
        console.log('[ViewportFix] innerHeight=' + getRealHeight() + ', innerWidth=' + getRealWidth());
      } catch(e) {
        console.warn('[ViewportFix] Failed to override innerHeight:', e);
      }

      function enforceHeight() {
        var h = getRealHeight();
        var w = getRealWidth();
        document.documentElement.style.setProperty('height', h + 'px', 'important');
        document.documentElement.style.setProperty('width', w + 'px', 'important');
        document.documentElement.style.setProperty('overflow', 'hidden', 'important');
        document.body.style.setProperty('height', h + 'px', 'important');
        document.body.style.setProperty('width', w + 'px', 'important');
        document.body.style.setProperty('overflow', 'hidden', 'important');
        document.body.style.setProperty('position', 'fixed', 'important');
        document.body.style.setProperty('top', '0', 'important');
        document.body.style.setProperty('left', '0', 'important');
      }
      enforceHeight();

      var observer = new MutationObserver(function(mutations) {
        enforceHeight();
        var selectors = ['flt-glass-pane', 'flutter-view', 'flt-scene-host', 'flt-glass-pane > flt-scene-host'];
        selectors.forEach(function(sel) {
          var els = document.querySelectorAll(sel);
          els.forEach(function(el) {
            el.style.setProperty('position', 'absolute', 'important');
            el.style.setProperty('top', '0', 'important');
            el.style.setProperty('left', '0', 'important');
            el.style.setProperty('width', '100%', 'important');
            el.style.setProperty('height', '100%', 'important');
            el.style.setProperty('overflow', 'hidden', 'important');
          });
        });
      });
      observer.observe(document.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['style']
      });

      var fixCount = 0;
      var maxFixes = 50;
      var fixInterval = setInterval(function() {
        enforceHeight();
        fixCount++;
        if (fixCount >= maxFixes) {
          clearInterval(fixInterval);
          console.log('[ViewportFix] Periodic fixes stopped after ' + fixCount + ' iterations');
        }
      }, 200);

      window.addEventListener('resize', enforceHeight);
      window.addEventListener('orientationchange', function() {
        setTimeout(enforceHeight, 100);
        setTimeout(enforceHeight, 500);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', enforceHeight);
        window.visualViewport.addEventListener('scroll', enforceHeight);
      }

      console.log('[ViewportFix] Initialized. Real viewport: ' + getRealWidth() + 'x' + getRealHeight());
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
