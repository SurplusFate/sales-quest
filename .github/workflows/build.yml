name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不使用 android-actions/setup-android: 它在新 runner 镜像上会因预装
      # cmdline-tools 版本不符而执行已移除的 `sdkmanager tools` 并报错。
      # ubuntu-latest 已预装 Android SDK, 直接用其 sdkmanager 装所需包即可。
      - name: 准备 Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 逐项安装并容忍个别包名差异; AGP 默认会自动补装缺失组件
          sdkmanager "platform-tools" || true
          sdkmanager "platforms;android-36" || true
          sdkmanager "build-tools;36.0.0" || true
          sdkmanager "build-tools;35.0.0" || true
          echo "--- 已安装组件 ---"
          sdkmanager --list_installed | head -40 || true
          # 确保 Gradle 能找到 SDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      # GitHub Actions 的 step `if` 不允许直接引用 secrets 上下文,
      # 因此这里用 env 读取 secrets, 再把结论写进 output 供后续 if 使用。
      - name: 检测是否已配置签名密钥
        id: keycheck
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_PROPERTIES" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
            echo "==> 检测到签名密钥, 将构建 release 签名包"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "==> 未配置签名密钥, 将构建 debug 包"
          fi

      - name: 写入签名配置 (仅已配置密钥时)
        if: steps.keycheck.outputs.have_key == 'true'
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
          STORE_FILE=$(grep '^storeFile=' keystore.properties | cut -d= -f2)
          echo "解码密钥库到: $STORE_FILE"
          echo "$KEYSTORE_BASE64" | base64 -d > "$STORE_FILE"

      - name: 构建 APK
        env:
          HAVE_KEY: ${{ steps.keycheck.outputs.have_key }}
        run: |
          if [ "$HAVE_KEY" = "true" ]; then
            echo "==> 使用 release 签名构建"
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "==> 使用 debug 签名构建"
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: 收集产物路径
        id: artifacts
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=app-release.apk" >> "$GITHUB_OUTPUT"
            if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
              echo "mapping=app/build/outputs/mapping/release/mapping.txt" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "name=app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.name }}
          path: ${{ steps.artifacts.outputs.apk }}
          if-no-files-found: error

      - name: 上传混淆映射 (仅 release)
        if: steps.artifacts.outputs.mapping != ''
        uses: actions/upload-artifact@v4
        with:
          name: mapping.txt
          path: ${{ steps.artifacts.outputs.mapping }}