name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 平台 (compileSdk 36)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 写入签名配置 (有密钥时)
        # 仅在仓库设置了 KEYSTORE_BASE64 / KEYSTORE_PROPERTIES 两个 secret 时写入密钥,
        # 否则跳过 → 下方会退化为 debug 签名构建, 保证始终能产出可安装 APK。
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PROPERTIES != '' }}
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
          STORE_FILE=$(grep '^storeFile=' keystore.properties | cut -d= -f2)
          echo "解码密钥库到: $STORE_FILE"
          echo "$KEYSTORE_BASE64" | base64 -d > "$STORE_FILE"

      - name: 构建 Release (有密钥) 或 Debug (无密钥)
        env:
          HAVE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PROPERTIES != '' }}
        run: |
          if [ "$HAVE_KEYSTORE" = "true" ]; then
            echo "==> 使用 release 签名构建"
            ./gradlew assembleRelease --no-daemon
          else
            echo "==> 未配置密钥, 使用 debug 签名构建"
            ./gradlew assembleDebug --no-daemon
          fi

      - name: 收集产物路径
        id: artifacts
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=app-release.apk" >> "$GITHUB_OUTPUT"
            if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
              echo "mapping=app/build/outputs/mapping/release/mapping.txt" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "name=app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.name }}
          path: ${{ steps.artifacts.outputs.apk }}
          if-no-files-found: error

      - name: 上传混淆映射 (仅 release)
        if: ${{ steps.artifacts.outputs.mapping != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mapping.txt
          path: ${{ steps.artifacts.outputs.mapping }}
